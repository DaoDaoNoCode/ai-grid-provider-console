packages:
  - .
allowBuilds:
  esbuild: true

# The Perses 0.56 prereleases (React 19 support), newer than pnpm's minimum release age when we
# moved to them. Remove these entries when Perses 0.56.0 is released and the console moves to it.
minimumReleaseAgeExclude:
  - '@perses-dev/client@0.56.0-beta.0'
  - '@perses-dev/components@0.56.0-beta.0'
  - '@perses-dev/dashboards@0.56.0-beta.0'
  - '@perses-dev/explore@0.56.0-beta.0'
  - '@perses-dev/gauge-chart-plugin@0.15.0-beta.0'
  - '@perses-dev/loki-plugin@0.8.0-beta.0'
  - '@perses-dev/markdown-plugin@0.14.0-beta.0'
  - '@perses-dev/pie-chart-plugin@0.16.0-beta.0'
  - '@perses-dev/plugin-system@0.56.0-beta.0'
  - '@perses-dev/prometheus-plugin@0.60.0-beta.0'
  - '@perses-dev/stat-chart-plugin@0.16.0-beta.0'
  - '@perses-dev/table-plugin@0.15.0-beta.0'
  - '@perses-dev/timeseries-chart-plugin@0.15.0-beta.0'

# Perses 0.56 still declares Query v4. The real-renderer browser test in e2e/perses.spec.ts
# verifies its v5 integration; keep the console and all plugins on the same runtime.
# Under v5, three things in Perses behave differently (docs/connect.md, "Perses on Query v5"):
# the query summary table counts no active queries ('loading' is 'pending' in v5), a panel
# plugin that fails to load shows "Missing PanelComponent ..." instead of its own error
# (`useErrorBoundary` is `throwOnError` in v5), and a disabled query without data is not
# `isLoading`. Drop this override once the @perses-dev packages declare Query v5.
overrides:
  '@tanstack/react-query': 5.105.0
  # GHSA-w74x-v6f9-j3xg (URI scheme spoofing): @perses-dev/plugin-system 0.56.0-beta.0 pins
  # fast-uri 3.1.8. Drop this once the Perses release in use depends on fast-uri 3.1.9 or later.
  'fast-uri@<3.1.9': 3.1.9
  # GHSA-6pq8-jhm2-2vcw (qs.stringify denial of service): @perses-dev/explore 0.56.0-beta.0 pins
  # qs 6.16.0. Drop this once the Perses release in use depends on qs 6.16.1 or later.
  'qs@>=6.7.0 <6.16.1': 6.16.1
