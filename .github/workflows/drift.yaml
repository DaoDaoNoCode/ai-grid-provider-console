# Does the backend still answer the RPCs the BFF calls over gRPC (AiGrid/Ping, for /readyz)
# with the messages the BFF sends and reads? Nightly, and on demand, this refreshes the vendored
# copy in mock/proto/upstream from the backend's main branch (or the ref you give) and runs the
# drift test against it. The refresh happens in the runner's checkout only; nothing is
# committed. A failure means the backend changed an RPC the BFF calls: run
# hack/sync-upstream-proto.sh <ref> locally, update the draft message the BFF calls it with, and
# commit them together.
name: Proto drift

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Backend branch, tag or commit to check against
        default: main

permissions:
  contents: read

jobs:
  drift:
    name: The BFF's calls match the backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bff/go.mod
          cache-dependency-path: bff/go.sum
      - name: Refresh the vendored backend proto (not committed)
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: hack/sync-upstream-proto.sh "$REF"
      - name: What changed upstream since the vendored commit
        run: git --no-pager diff --stat -- mock/proto/upstream
      - name: Drift test
        working-directory: bff
        run: go test -count=1 ./internal/protodrift/
