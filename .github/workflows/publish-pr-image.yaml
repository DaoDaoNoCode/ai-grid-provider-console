name: publish-pr-image

# Second half of the pull request image pipeline. publish-image.yaml builds a PR's image without
# credentials and uploads it as an OCI archive; this workflow runs in the base repository's context
# (workflow_run), so it holds a write token even for a fork's PR, and pushes the archive to ghcr.io
# as pr-<number>.
#
# Not gated on the triggering run's result: a PR image is for trying the PR, and only ever writes
# pr-<number>, never sha-*, latest or a version. With no artifact (the build failed) it skips.
#
# Everything from the triggering run is untrusted, because it was built from unreviewed code, so
# this workflow
#   - never executes the artifact: skopeo copies it to the registry as data,
#   - pushes only the image names in ALLOWED_IMAGES, so a PR can't rename its artifact to overwrite
#     another package, and
#   - finds the PR number through the API from the payload's head repository, branch and SHA,
#     never from anything the PR run wrote.
#
# workflow_run always runs this file as it is on the default branch, never a PR's copy.

on:
  workflow_run:
    workflows: [publish-image]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-pr-image-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # The images this workflow may push; keep in step with publish-image.yaml.
  ALLOWED_IMAGES: ai-grid-provider-console

jobs:
  push:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      # Download the triggering run's artifact.
      actions: read
      # List pull requests to find the number.
      pull-requests: read
      packages: write
    steps:
      - name: Find the open PR for this head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # By head repository and branch, not by commit: GET /commits/{sha}/pulls returns nothing
          # for the head of an open PR from a fork. The SHA filter drops runs whose PR has newer
          # commits; the newer run owns pr-<number>.
          number=$(gh api --method GET "repos/${REPO}/pulls" \
            -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f state=open \
            --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\")][0].number // empty")
          if [ -z "$number" ]; then
            echo "No open PR from ${HEAD_OWNER}:${HEAD_BRANCH} has ${HEAD_SHA} as its head; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the image artifact
        if: steps.pr.outputs.skip != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pr-image-*
          path: /tmp/pr-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          shopt -s nullglob
          dirs=(/tmp/pr-images/pr-image-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No image artifact on run ${RUN_ID}; skipping."
            exit 0
          fi
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          for dir in "${dirs[@]}"; do
            image=$(basename "$dir")
            image=${image#pr-image-}
            case " $ALLOWED_IMAGES " in
              *" $image "*) ;;
              *)
                echo "::warning::ignoring an artifact for unexpected image '$image'"
                continue
                ;;
            esac
            dest="ghcr.io/${OWNER}/${image}:pr-${PR_NUMBER}"

            # What pr-<number> pointed at, so the superseded version can go once the tag moves.
            old_digest=$(skopeo inspect --format '{{.Digest}}' --no-tags "docker://${dest}" 2>/dev/null || true)

            skopeo copy "oci-archive:${dir}${image}.tar" "docker://${dest}"

            new_digest=$(skopeo inspect --format '{{.Digest}}' --no-tags "docker://${dest}")
            if [ -n "$old_digest" ] && [ "$old_digest" != "$new_digest" ]; then
              # Delete exactly the version the tag left, and only if nothing else tags it.
              id=$(gh api "orgs/${OWNER}/packages/container/${image}/versions" --paginate \
                --jq ".[] | select(.name == \"${old_digest}\" and (.metadata.container.tags | length == 0)) | .id")
              if [ -n "$id" ]; then
                echo "Deleting superseded ${image}@${old_digest} (version ${id})"
                gh api --method DELETE "orgs/${OWNER}/packages/container/${image}/versions/${id}"
              fi
            fi
          done
