// Stopgap: the messages of the backend's real ai_grid.v1 Clusters, Tenants and
// Subscriptions services, copied from ai-grid-provider-backend proto/ai_grid/v1 (clusters and
// tenants at 8c1a1bc, PR 16; subscriptions at PR 27's merge ref 3428d8d) (clusters_service,
// condition_type, managed_cluster_type, metadata_type, subscription_type, subscriptions_service,
// tenant_type, tenants_service), so the BFF can call those RPCs. Fields the BFF doesn't use are
// left out. Field numbers, names and types are unchanged; the validation and HTTP
// options are dropped. The package is renamed because the draft in ../../v1 declares the same
// message names in ai_grid.v1: protobuf is wire-compatible across package names, and the BFF
// calls the real method paths (/ai_grid.v1.Clusters/List ...) itself (bff/internal/backend/v1.go).
syntax = "proto3";

package ai_grid.backend.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ai-grid-cloud/ai-grid-provider-console/bff/gen/ai_grid/backend/v1;backendv1";

message Metadata {
  google.protobuf.Timestamp creation_timestamp = 1;
  google.protobuf.Timestamp deletion_timestamp = 2;
  string creator = 3;
  string tenant = 4;
  string name = 5;
  map<string, string> labels = 6;
  map<string, string> annotations = 7;
  int32 version = 8;
}

message ManagedCluster {
  string id = 1;
  Metadata metadata = 2;
  ManagedClusterSpec spec = 3;
  ManagedClusterStatus status = 4;
}

message ManagedClusterSpec {
  bool hub_accepts_client = 1;
}

message ManagedClusterStatus {
  bool available = 1;
  bool joined = 2;
  string available_condition = 3;
  string provisioning = 4;
}

message ClustersListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message ClustersListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated ManagedCluster items = 3;
}

message ClustersGetRequest {
  string id = 1;
}

message ClustersGetResponse {
  ManagedCluster object = 1;
}

message ClustersUpdateRequest {
  ManagedCluster object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message ClustersUpdateResponse {
  ManagedCluster object = 1;
}

message Tenant {
  string id = 1;
  Metadata metadata = 2;
  TenantSpec spec = 3;
  TenantStatus status = 4;
}

message TenantSpec {
  repeated string domains = 1;
}

message TenantStatus {}

message TenantsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message TenantsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated Tenant items = 3;
}

message TenantsGetRequest {
  string id = 1;
}

message TenantsGetResponse {
  Tenant object = 1;
}

message TenantsCreateRequest {
  Tenant object = 1;
}

message TenantsCreateResponse {
  Tenant object = 1;
}

message TenantsUpdateRequest {
  Tenant object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message TenantsUpdateResponse {
  Tenant object = 1;
}

message TenantsDeleteRequest {
  string id = 1;
  int32 version = 2;
}

message TenantsDeleteResponse {}

enum ConditionStatus {
  CONDITION_STATUS_UNSPECIFIED = 0;
  CONDITION_STATUS_TRUE = 1;
  CONDITION_STATUS_FALSE = 2;
}

message Condition {
  string type = 1;
  ConditionStatus status = 2;
  google.protobuf.Timestamp last_transition_time = 3;
  optional string reason = 4;
  optional string message = 5;
}

message Subscription {
  string id = 1;
  Metadata metadata = 2;
  SubscriptionSpec spec = 3;
  SubscriptionStatus status = 4;
}

message SubscriptionSpec {
  SubscriptionOwner owner = 1;
  repeated SubscriptionModelRef model_refs = 2;
  int32 priority = 3;
  SubscriptionOrganization organization = 4;
  TokenMetadata token_metadata = 5;
  optional int32 inference_priority = 6;
  repeated GuardrailAttachment guardrails = 7;
}

message SubscriptionOrganization {
  string id = 1;
}

message SubscriptionOwner {
  repeated string groups = 1;
  repeated string users = 2;
}

message SubscriptionModelRef {
  string name = 1;
  string namespace = 2;
  repeated TokenRateLimit token_rate_limits = 3;
  bool unlimited = 4;
  BillingRate billing_rate = 5;
  repeated GuardrailAttachment guardrails = 6;
  string display_name = 7;
  string description = 8;
}

message TokenRateLimit {
  int64 limit = 1;
  string window = 2;
}

message BillingRate {
  string per_token = 1;
}

message TokenMetadata {
  string cost_center = 2;
  map<string, string> labels = 3;
}

message GuardrailAttachment {
  string ref_name = 1;
  repeated string checks = 2;
}

message SubscriptionStatus {
  string phase = 1;
  repeated Condition conditions = 2;
  repeated ResourceRefStatus model_ref_statuses = 3;
  repeated TokenRateLimitStatus token_rate_limit_statuses = 4;
}

message ResourceRefStatus {
  string name = 1;
  string namespace = 2;
  bool ready = 3;
  string reason = 4;
  string message = 5;
}

message TokenRateLimitStatus {
  ResourceRefStatus ref = 1;
  string model = 2;
}

message AuthPolicy {
  string id = 1;
  Metadata metadata = 2;
  repeated string subject_groups = 3;
  repeated AuthPolicyModelRef model_refs = 5;
  string phase = 6;
  repeated Condition conditions = 7;
}

message AuthPolicyModelRef {
  string name = 1;
  string namespace = 2;
}

message ModelRegistration {
  string name = 1;
  string namespace = 2;
  string phase = 3;
  string endpoint = 4;
  repeated Condition conditions = 5;
}

message SubscriptionsListRequest {}

message SubscriptionsListResponse {
  repeated Subscription items = 3;
}

message SubscriptionsGetRequest {
  string id = 1;
}

message SubscriptionsGetResponse {
  Subscription object = 1;
  repeated AuthPolicy auth_policies = 2;
  repeated ModelRegistration model_registrations = 3;
}

message SubscriptionsCreateRequest {
  Subscription object = 1;
}

message SubscriptionsCreateResponse {
  Subscription object = 1;
  AuthPolicy auth_policy = 2;
}

message SubscriptionsUpdateRequest {
  Subscription object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message SubscriptionsUpdateResponse {
  Subscription object = 1;
}

message SubscriptionsDeleteRequest {
  string id = 1;
}

message SubscriptionsDeleteResponse {}
