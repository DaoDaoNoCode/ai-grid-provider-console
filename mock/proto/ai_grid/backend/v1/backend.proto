// Stopgap: the messages of the backend's real ai_grid.v1 Tenants service, copied from
// ai-grid-provider-backend proto/ai_grid/v1 at 8c1a1bc (metadata_type, tenant_type,
// tenants_service), with TenantSpec.identity_provider, IdentityProvider and OidcConfig from
// 57b2fba, so
// the BFF can call those RPCs. Fields the BFF doesn't use are
// left out. Field numbers, names and types are unchanged; the validation and HTTP
// options are dropped. The package is renamed because the draft in ../../v1 declares the same
// message names in ai_grid.v1: protobuf is wire-compatible across package names, and the BFF
// calls the real method paths (/ai_grid.v1.Tenants/List ...) itself (bff/internal/backend/v1.go).
syntax = "proto3";

package ai_grid.backend.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ai-grid-cloud/ai-grid-provider-console/bff/gen/ai_grid/backend/v1;backendv1";

message Metadata {
  google.protobuf.Timestamp creation_timestamp = 1;
  google.protobuf.Timestamp deletion_timestamp = 2;
  string creator = 3;
  string tenant = 4;
  string name = 5;
  map<string, string> labels = 6;
  map<string, string> annotations = 7;
  int32 version = 8;
}

message Tenant {
  string id = 1;
  Metadata metadata = 2;
  TenantSpec spec = 3;
  TenantStatus status = 4;
}

message TenantSpec {
  repeated string domains = 1;
  IdentityProvider identity_provider = 2;
}

message IdentityProvider {
  string title = 1;
  string description = 2;
  optional bool enabled = 3;
  OidcConfig config = 4;
}

message OidcConfig {
  string client_id = 1;
  string client_secret_secret_name = 2;
  string issuer = 3;
  string authorization_url = 4;
  string token_url = 5;
  string default_scopes = 6;
  string user_info_url = 7;
  string jwks_url = 8;
  string logout_url = 9;
  optional bool validate_signature = 10;
}

message TenantStatus {}

message TenantsListRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  optional string filter = 3;
  optional string order = 4;
}

message TenantsListResponse {
  int32 size = 1;
  int32 total = 2;
  repeated Tenant items = 3;
}

message TenantsGetRequest {
  string id = 1;
}

message TenantsGetResponse {
  Tenant object = 1;
}

message TenantsCreateRequest {
  Tenant object = 1;
}

message TenantsCreateResponse {
  Tenant object = 1;
}

message TenantsUpdateRequest {
  Tenant object = 1;
  google.protobuf.FieldMask update_mask = 2;
  bool lock = 3;
}

message TenantsUpdateResponse {
  Tenant object = 1;
}

message TenantsDeleteRequest {
  string id = 1;
  int32 version = 2;
}

message TenantsDeleteResponse {}
