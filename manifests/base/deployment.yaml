apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-provider-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-grid-provider-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-grid-provider-console
    spec:
      serviceAccountName: ai-grid-provider-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Login: OpenShift OAuth via kube-auth-proxy, the proxy RHOAI uses.
        # Flags follow the opendatahub-operator gateway template. The proxy
        # forwards the user's access token and name to the BFF in
        # X-Forwarded-Access-Token and X-Forwarded-User.
        - name: kube-auth-proxy
          image: kube-auth-proxy
          args:
            - --provider=openshift
            - --https-address=0.0.0.0:8443
            - --http-address=127.0.0.1:4180
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-key-file=/etc/tls/private/tls.key
            - --upstream=http://127.0.0.1:8080/
            - --redirect-url=$(OAUTH2_PROXY_REDIRECT_URL)
            - --email-domain=*
            - --scope=user:full
            - --skip-provider-button
            - --pass-access-token=true
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --skip-jwt-bearer-tokens=true
            - --enable-k8s-token-validation=true
            - --use-system-trust-store=true
            - --cookie-name=_ai_grid_console
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --cookie-refresh=1h
          env:
            # Created by hack/deploy.sh together with the OAuthClient.
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_COOKIE_SECRET
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: ai-grid-provider-console-oauth
                  key: OAUTH2_PROXY_REDIRECT_URL
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # The console: a thin BFF plus the built frontend. It translates the
        # frontend's JSON calls into gRPC on the backend container over
        # loopback and forwards the caller's identity in request metadata.
        - name: bff
          image: ai-grid-provider-console
          args:
            - --port=8080
            - --static-assets-dir=/static
            - --backend-address=127.0.0.1:9090
          env:
            - name: PROVIDER_ADMIN_GROUPS
              value: ""
            - name: GRID_CONSUMER_URL
              value: ""
            - name: MAP_TILE_URL
              value: ""
            - name: BILLING_URL
              value: ""
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        # ai-grid-backend: owns every call to the hub API, Keycloak and
        # metrics using the pod's ServiceAccount. Only the BFF talks to it. It
        # listens on all interfaces so the kubelet can probe it; restrict
        # access with a NetworkPolicy once it moves to its own Deployment.
        - name: ai-grid-backend
          image: ai-grid-backend
          args:
            - --listen-address=:9090
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak.grid-sso.svc:8080
            - name: KEYCLOAK_ADMIN_REALM
              value: master
            - name: KEYCLOAK_REALM
              value: ai-grid
            # Optional: created by hack/deploy.sh when KEYCLOAK_ADMIN_PASSWORD is set.
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: username
                  optional: true
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-grid-backend-keycloak
                  key: password
                  optional: true
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tls
          secret:
            secretName: ai-grid-provider-console-tls
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
