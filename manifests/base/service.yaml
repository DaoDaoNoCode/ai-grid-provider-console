apiVersion: v1
kind: Service
metadata:
  name: ai-grid-provider-console
  annotations:
    # OpenShift issues a serving certificate for the proxy's HTTPS listener.
    service.beta.openshift.io/serving-cert-secret-name: ai-grid-provider-console-tls
spec:
  selector:
    app.kubernetes.io/name: ai-grid-provider-console
  ports:
    - name: https
      port: 8443
      targetPort: https
