# kube-auth-proxy validates bearer tokens with TokenReviews
# (--enable-k8s-token-validation), which needs system:auth-delegator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-console-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid
---
# ai-grid-backend reads ManagedClusters with the pod's ServiceAccount. These
# rules mirror deploy/kind/ai-grid-backend.yaml in the backend repository; grow
# them there first when the backend needs more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-console-backend
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-console-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-console-backend
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-console
    namespace: ai-grid
