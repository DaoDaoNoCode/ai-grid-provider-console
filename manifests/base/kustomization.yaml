apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-grid

commonLabels:
  app.kubernetes.io/name: ai-grid-provider-console
  app.kubernetes.io/part-of: ai-grid

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

images:
  - name: ai-grid-provider-console
    newName: quay.io/cfchase/ai-grid-provider-console
    newTag: latest
  - name: kube-auth-proxy
    newName: quay.io/opendatahub/odh-kube-auth-proxy
    newTag: latest
  # Built from https://github.com/yuvalturg/ai-grid-backend (Containerfile);
  # no published image yet, so hack/deploy.sh takes BACKEND_IMAGE.
  - name: ai-grid-backend
    newName: quay.io/ai-grid-cloud/ai-grid-backend
    newTag: latest
