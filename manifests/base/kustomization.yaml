apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-grid

# On every object, and in the Deployment's selector and pod template (includeSelectors), as the
# deprecated commonLabels did: the selector can't change, so this must not either.
labels:
  - pairs:
      app.kubernetes.io/name: ai-grid-provider-console
      app.kubernetes.io/part-of: ai-grid
    includeSelectors: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

images:
  - name: ai-grid-provider-console
    newName: ghcr.io/ai-grid-cloud/ai-grid-provider-console
    newTag: latest
  - name: kube-auth-proxy
    newName: quay.io/opendatahub/odh-kube-auth-proxy
    newTag: latest
  # Published by https://github.com/ai-grid-cloud/ai-grid-provider-backend's CI: the build of the
  # commit in .backend-api-version, as in the chart's values.yaml. Set by `make backend-pin` from
  # `.backend-api-version`; don't edit by hand.
  - name: ai-grid-backend
    newName: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
    newTag: sha-9a449bb659163e82d4884c83c30d7b53d8b48276
    digest: sha256:80b4a9f8ab7f6dc08871c635020cb4ae60c0e8d5d82de1b0b75dbbcffa3cbf15
