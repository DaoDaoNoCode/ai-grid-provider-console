apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-grid-provider-console
  annotations:
    # Browsers that have seen the console keep to HTTPS for a year.
    haproxy.router.openshift.io/hsts_header: max-age=31536000
    # Longer than kube-auth-proxy's upstream timeout, so a slow write ends in the console's own answer.
    haproxy.router.openshift.io/timeout: 70s
spec:
  to:
    kind: Service
    name: ai-grid-provider-console
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
