{{- with .Values.backend.idpSecrets }}
{{- if .enabled }}
{{- if eq .namespace $.Release.Namespace }}
{{- fail (printf "backend.idpSecrets.namespace must not be the release namespace %q: the backend can get every Secret in it, so it must hold only identity provider client secrets" .namespace) }}
{{- end }}
# Organization identity providers' client secrets (values.yaml, backend.idpSecrets): the backend
# gets each Secret by name when it creates the provider in Keycloak. get only: it never lists,
# watches or writes Secrets.
{{- if .createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
  labels:
    {{- include "console.labels" $ | nindent 4 }}
    app.kubernetes.io/component: idp-secrets
  annotations:
    # Provider admins put the Secrets here by hand: an uninstall must not delete them.
    helm.sh/resource-policy: keep
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" $ }}-idp-secrets
  namespace: {{ .namespace }}
  labels:
    {{- include "console.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" $ }}-idp-secrets
  namespace: {{ .namespace }}
  labels:
    {{- include "console.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" $ }}-idp-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
