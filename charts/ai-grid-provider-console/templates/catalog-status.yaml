{{- if .Values.backend.git.url }}
# The backend's deploy/openshift/rbac.yaml grants these same catalog reads.
# list exposes every Application spec in this namespace; keep secrets out of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "console.fullname" . }}-catalog-status
  namespace: {{ .Values.backend.git.catalogNamespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "console.fullname" . }}-catalog-status
  namespace: {{ .Values.backend.git.catalogNamespace }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "console.fullname" . }}-catalog-status
subjects:
  - kind: ServiceAccount
    name: {{ include "console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
